<title id="t">Cyber kill chain</title>
<desc id="d">Seven stages of the cyber kill chain — reconnaissance, weaponization, delivery, exploitation, installation, command and control, actions on objectives — with a signal travelling through them.</desc>
<defs></defs>
<rect width="760" height="150" rx="12" fill="#0f151d" stroke="#1f2a37"/>
<text x="24" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#7d8a99">cyber kill chain  —  the lens I use to map alerts to attacker stages</text>
<line x1="62" y1="72" x2="698" y2="72" stroke="#243244" stroke-width="2"/>
