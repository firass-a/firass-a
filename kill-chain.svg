<circle cx="274" cy="72" r="15" fill="#0f151d" stroke="#2ee6c5" stroke-width="1.8"/><circle cx="274" cy="72" r="15" fill="#2ee6c5" fill-opacity="0"><animate attributeName="fill-opacity" dur="9.00s" repeatCount="indefinite" keyTimes="0.0000;0.2000;0.2222;0.3222;1.0000" values="0;0;0.90;0;0" /></circle><text x="274" y="77" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#d0d7de">3</text><text x="274" y="114" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#9aa7b6">Deliver</text>
